# v で始まるタグ（例: v0.2.0-beta）を push すると、テスト → インストーラー作成 → GitHub Release への公開を行う。
# タグは Directory.Build.props のバージョンと一致させる。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test DreadHungerServerManager.sln -c Release --blame-hang-timeout 5m

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        run: ./scripts/Build-Installer.ps1

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $group = $props.Project.PropertyGroup
          $version = "$($group.VersionPrefix)-$($group.VersionSuffix)"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "タグ $env:GITHUB_REF_NAME と Directory.Build.props のバージョン v$version が一致しません。"
          }
          $releaseArgs = @(
            $env:GITHUB_REF_NAME,
            'dist/DreadHungerServerManager-Setup.exe',
            "dist/DreadHungerServerManager-$version-win-x64.zip",
            '--title', "Dread Hunger Server Manager $version",
            '--generate-notes'
          )
          # preview / rc はプレリリースにする（README の「最新版」URL の対象にしない）。
          if ($version -match 'preview|rc') {
            $releaseArgs += '--prerelease'
          }
          gh release create @releaseArgs
